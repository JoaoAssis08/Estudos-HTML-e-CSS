<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modelo de Caixas</title>
    <style>
        h1{ /* box-level*/
            background-color: lightgray;
            height: 2em;
            width: 400px;

            border: 10px solid darkslategray;

            padding: 20px 10px 5px;

            margin:20px auto 30px auto;
            
            text-align: center;

            outline: 3px dashed rgb(20, 217, 20);
            
        }

        a{ /*inline-level*/
            border-width: 3px;
            border-style: dashed;
            border-color: red;
            padding: 5px;
        }

        p{
            font-family: Arial, Helvetica, sans-serif;
            text-align: justify;
            text-indent: 20px;
        }
    </style>
</head>
<body>
    <h1>Exemplo de caixa box-level</h1>
    <p>Parágrafos também são exmeplos de box-level, mas os <a href="#">Links são exemplos de caixas inline-level</a>. Vamos ver como tudo isso funciona.</p>
</body>
</html>
