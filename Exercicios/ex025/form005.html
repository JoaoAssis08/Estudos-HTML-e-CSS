<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
     <h1>Exemplo de formulario</h1>
     <form action="" method="get" autocomplete="on">
        <fieldset>
            <legend>Sexo</legend>
            <input type="radio" name="sexo" id="imasc" value="M"> <label for="imasc">Masculino</label><br>
            <input type="radio" name="sexo" id="ifem" value="F"> <label for="ifem">Feminino</label><br>
        </fieldset>
        <fieldset>
            <legend>Esportes favoritos</legend>
            <input type="checkbox" name="fute" id="ifute"> <label for="ifute">Futebol</label><br>
            <input type="checkbox" name="basq" id="ibasq"> <label for="ibasq">Basquete</label><br>
            <input type="checkbox" name="vole" id="ivole"> <label for="ivole">Volei</label><br>
            <input type="checkbox" name="nata" id="inata"> <label for="inata">Natação</label><br>
        </fieldset>

        <p>
            <input type="submit">
            <input type="reset">
        </p>
     </form>
</body>
</html>
